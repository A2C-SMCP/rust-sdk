name: Publish to crates.io

on:
  release:
    types: [published]
  # 手动触发作为备用
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 发布前验证
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Dry-run publish (smcp)
        run: cargo publish --dry-run -p smcp

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: validate
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 按依赖顺序发布（dev-dependencies 也需要先发布）
      # 1. 基础协议层（无内部依赖）
      - name: Publish smcp
        run: cargo publish -p smcp --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index (smcp)
        run: sleep 30

      # 2. 依赖 smcp 的 crate，且被其他 crate dev-deps 引用
      - name: Publish smcp-server-core
        run: cargo publish -p smcp-server-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index (smcp-server-core)
        run: sleep 30

      # 3. 依赖 smcp，dev-deps 依赖 smcp-server-core
      - name: Publish smcp-agent
        run: cargo publish -p smcp-agent --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index (smcp-agent)
        run: sleep 30

      - name: Publish smcp-computer
        run: cargo publish -p smcp-computer --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index (smcp-computer)
        run: sleep 30

      # 4. 依赖 smcp-server-core
      - name: Publish smcp-server-hyper
        run: cargo publish -p smcp-server-hyper --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index (smcp-server-hyper)
        run: sleep 30

      # 5. 主包 (re-export 所有组件)
      - name: Publish a2c-smcp
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
