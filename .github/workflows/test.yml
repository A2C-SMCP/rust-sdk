name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # keyring（INP-01 #73 secret_store）在 Linux 经 secret-service 拉 libdbus-sys，
      # 需系统 dbus 开发库 + pkg-config（macOS 用 apple-native 无此依赖）。
      - name: Install system deps (libdbus for keyring on Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      # 回归防护（#203）：`[resolver]` 是 config-only 表（RFC 3537），置于 Cargo.toml 不生效
      # 且新版 Cargo 报 "unused manifest key: resolver" 警告；仅允许存在于 .cargo/config.toml。
      # 覆盖 TOML 空白/子表变体（[ resolver ]、[resolver.*]）；config 侧用 awk 把 key 约束在
      # [resolver] 表作用域内（避免 key 被移入其他表后静默失效）。
      - name: Check resolver config location (#203)
        run: |
          if grep -Eq '^\[[[:space:]]*resolver([[:space:]]*\.|[[:space:]]*\])' Cargo.toml; then
            echo "::error::[resolver] is config-only (RFC 3537) — must live in .cargo/config.toml, not Cargo.toml"
            exit 1
          fi
          awk '/^\[[[:space:]]*resolver([[:space:]]*\.|[[:space:]]*\])/ {on=1} /^\[/ && $0 !~ /^\[[[:space:]]*resolver([[:space:]]*\.|[[:space:]]*\])/ {on=0} on && /^[[:space:]]*incompatible-rust-versions[[:space:]]*=[[:space:]]*"fallback"/ {f=1} END {exit f?0:1}' .cargo/config.toml

      - name: Clippy (workspace)
        run: cargo clippy --workspace --features agent,computer,server -- -D warnings

      - name: Build
        run: cargo build --workspace --features agent,computer,server

      # rustdoc 门禁（#146）：intra-doc 链接 / HTML 标签 / 冗余链接等警告一律视为错误，防新增。
      # Docs gate (#146): treat rustdoc warnings (intra-doc links, HTML tags, …) as errors.
      - name: Docs (rustdoc deny-warnings gate)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

      - name: Run tests
        run: cargo test --workspace --features agent,computer,server

  # 单独测试各个 crate 以确保独立可用
  test-crates:
    name: Test Individual Crates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # keyring（INP-01 #73 secret_store）在 Linux 经 secret-service 拉 libdbus-sys，
      # 需系统 dbus 开发库 + pkg-config（macOS 用 apple-native 无此依赖）。
      - name: Install system deps (libdbus for keyring on Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Check smcp-computer package contents
        run: cargo package -p smcp-computer --no-verify --list | grep -Fx 'docs/oauth-host-integration.md'

      - name: Test smcp
        run: cargo test -p smcp

      - name: Test smcp-agent
        run: cargo test -p smcp-agent --all-features

      - name: Test smcp-computer
        run: cargo test -p smcp-computer --features vrl,cli

      - name: Test Atlassian OAuth UAT driver
        run: cargo test -p smcp-computer --example oauth_atlassian_uat

      - name: Test smcp-server-core
        # 限制线程数为 1，避免 Socket.IO 集成测试并行运行时的端口冲突和资源争用
        run: cargo test -p smcp-server-core --all-features -- --test-threads=1

      - name: Test smcp-server-hyper
        run: cargo test -p smcp-server-hyper
