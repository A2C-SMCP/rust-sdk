# Cargo 配置文件 / Cargo configuration file
# 定义别名以简化常用命令 / Define aliases to simplify common commands

[alias]
# 测试相关别名 / Test aliases
# #212：test-ws 改走 cargo-nextest（并行执行各测试二进制 + per-test 计时），需要
# `cargo install cargo-nextest --locked`；无 nextest 时用 test-ws-cargo 获得原 `cargo test` 行为（CI 对齐）。
# test-ws now goes through cargo-nextest (parallel test binaries + per-test timing) — requires
# `cargo install cargo-nextest --locked`; use test-ws-cargo for plain `cargo test` (CI parity).
test-ws = "nextest run --workspace"
test-ws-cargo = "test --workspace"
test-all = "test --workspace --all-features"
test-e2e = "test --workspace --features e2e -- --ignored"
# 治理层 CLI 子命令测试在 `cli` feature 之下（marketplace/plugin/settings/skill）；默认带上避免治理套件变暗。
# Governance CLI subcommand tests live behind the `cli` feature — enable it so the suite is never dark.
test-computer = "test -p smcp-computer --features cli"
test-agent = "test -p smcp-agent"
test-server = "test -p smcp-server-core"
test-integration = "test -p smcp-computer --test mcp_clients_integration"
test-e2e-playwright = "test -p smcp-computer --test playwright --features e2e"
test-all-cov = "llvm-cov --workspace --all-features --no-fail-fast --text --summary-only"

# 检查相关别名 / Check aliases
check-workspace = "check --workspace"
check-all = "check --workspace --all-features"

# 构建相关别名 / Build aliases
build-ws = "build --workspace"
build-all = "build --workspace --all-features"

# 代码质量别名 / Code quality aliases
fmt-all = "fmt --all"
clippy-workspace = "clippy --workspace --all-targets --all-features -- -D warnings"
clippy-loose = "clippy --workspace --all-targets --all-features"
# rustdoc 门禁（#146）：本地跑 `RUSTDOCFLAGS="-D warnings" cargo doc-check` 复现 CI 的零警告黄金基线。
# Docs gate (#146): run `RUSTDOCFLAGS="-D warnings" cargo doc-check` locally to mirror the CI zero-warning baseline.
doc-check = "doc --workspace --all-features --no-deps"

# 运行相关别名 / Run aliases
run-server = "run -p smcp-server-hyper"
run-agent = "run -p smcp-agent --bin agent"
run-computer = "run -p smcp-computer --bin computer"

# MSRV 兼容：工具链低于声明的 rust-version 时，解析阶段回落到兼容版本的依赖
# （Cargo ≥ 1.84 支持；旧工具链因此得到清晰提示而非晦涩的 manifest 解析错误）。
# Fall back to rust-version-compatible deps on older toolchains (Cargo ≥ 1.84),
# so they get a clear MSRV message instead of a cryptic manifest parse error.
# config-only table（RFC 3537）：放在 Cargo.toml 中不生效，且新版 Cargo 会报
# "unused manifest key: resolver" 警告。
[resolver]
incompatible-rust-versions = "fallback"

# ── 链接加速（#212）── 经实测，homebrew 的 `lld` 与其 `llvm` 版本错位（本机 lld 20.1.8 vs
# llvm 21.1.5）会在链接 build script 时崩溃（liblldELF.dylib 与 libLLVM.dylib 符号不匹配）。
# 因此仓库不提交 rustflags linker；macOS 上推荐机器级（~/.cargo/config.toml）使用 rustup
# 自带的 rust-lld（自洽 LLVM，无需 brew，且支持 Mach-O —— 已实测可用），样板见
# docs/local-dev-tests.md「链接加速」节。
# Linker acceleration (#212): `brew install lld` is version-skewed against `brew llvm` on this
# machine (lld 20.1.8 vs llvm 21.1.5) and crashes when linking build scripts. Do NOT commit
# -fuse-ld=lld; use rustup's bundled rust-lld at the machine level instead — see
# docs/local-dev-tests.md (linker acceleration section).


