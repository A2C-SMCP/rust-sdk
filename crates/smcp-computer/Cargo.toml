[package]
name = "smcp-computer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A2C-SMCP Computer client for MCP server management"
repository = "https://github.com/A2C-SMCP/rust-sdk"
keywords = ["smcp", "computer", "mcp", "tool"]
categories = ["network-programming", "development-tools"]

[dev-dependencies]
# 去抖器单测用 tokio 虚拟时钟（start_paused）/ paused virtual clock for debouncer tests（SKL-06 #55）
tokio = { workspace = true, features = ["test-util"] }
smcp-server-hyper.workspace = true
smcp-server-core.workspace = true
tracing-subscriber.workspace = true
hyper.workspace = true
tower.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
futures-util.workspace = true
socketioxide.workspace = true
rustls-pemfile = "2"
tokio-rustls = "0.26"

[dependencies]
smcp.workspace = true
smcp-client-transport.workspace = true

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
futures-util.workspace = true
async-trait.workspace = true
sse-stream.workspace = true
dashmap.workspace = true
async-recursion.workspace = true

tf-rust-socketio.workspace = true
tokio-util.workspace = true
regex.workspace = true
lazy_static.workspace = true
chrono.workspace = true

# MCP SDK / MCP SDK
rmcp.workspace = true

# HTTP客户端 / HTTP Client
reqwest.workspace = true
http.workspace = true
http-auth = { version = "0.1.10", default-features = false }

# SSE客户端 / SSE Client
eventsource-client.workspace = true
futures.workspace = true

# URL解析 / URL parsing
url.workspace = true
dirs.workspace = true
percent-encoding = "2.3"

# 密码输入 / Password input
rpassword.workspace = true
tar = "0.4.46"
flate2 = "1.1.9"

# blob_handle 编解码（base64url + msgpack；BLB-01 #62）/ blob handle codec
base64.workspace = true
jsonwebtoken.workspace = true
rmp-serde.workspace = true
serde_yaml_ng = "0.10.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
indexmap = { version = "2.14.0", features = ["serde"] }
sha2.workspace = true

# SKILL user 源文件 watcher / SKILL user-source file watcher（SKL-06 #55）
notify = "8.2.0"

# 治理层物化文件锁（known_marketplaces / installed_plugins 旁车 .lock）/ governance store file lock（SET-04 #67）
fd-lock.workspace = true

# 治理层平台原生依赖（off-platform 零成本）/ governance platform-native deps
# macOS：Managed Preferences plist（SET-03 #65 layer 2）+ Keychain（INP-01 #73 secret_store）
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
keyring = { version = "3", features = ["apple-native"] }

# Windows：注册表策略（SET-03 #65 layer 2/4，best-effort 无 CI lane）+ Credential Manager（INP-01 #73）
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
keyring = { version = "3", features = ["windows-native"] }

# Linux/BSD：OS Secret Service（INP-01 #73 secret_store；sync-secret-service 纯 Rust zbus，无需系统 libdbus）
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[features]
default = ["vrl"]
vrl = ["dep:vrl"]
cli = ["dep:clap", "dep:crossterm", "dep:console", "dep:rustyline", "dep:rustyline-derive"]
e2e = []

[dependencies.vrl]
workspace = true
optional = true

[dependencies.clap]
workspace = true
optional = true

[dependencies.crossterm]
workspace = true
optional = true

[dependencies.console]
workspace = true
optional = true

[dependencies.rustyline]
workspace = true
optional = true

[dependencies.rustyline-derive]
workspace = true
optional = true

[[bin]]
name = "smcp-computer"
required-features = ["cli"]
