[package]
name = "smcp-server-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A2C-SMCP Server core implementation with Socket.IO"
repository = "https://github.com/A2C-SMCP/rust-sdk"
keywords = ["smcp", "server", "socketio", "mcp"]
categories = ["network-programming", "web-programming"]

[dependencies]
smcp.workspace = true

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

socketioxide.workspace = true
uuid.workspace = true
async-trait.workspace = true
dashmap.workspace = true
http.workspace = true
futures-util.workspace = true
tower = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }

[features]
default = []
hyper = ["dep:tower", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]

[dev-dependencies]
tf-rust-socketio.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
hyper-tungstenite.workspace = true
tracing-subscriber.workspace = true
tower.workspace = true
