[package]
name = "smcp-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A2C-SMCP Agent client implementation"
repository = "https://github.com/A2C-SMCP/rust-sdk"
keywords = ["smcp", "agent", "client", "mcp"]
categories = ["network-programming"]

[features]
default = ["async"]
async = []
sync = ["async"]

[dependencies]
smcp.workspace = true
smcp-client-transport.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# AGT-04 #41：tool_call 二进制旁路回填——drain 回字节后重编码为 content item 的 base64 内联载体。
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
futures-util.workspace = true
async-trait.workspace = true
tf-rust-socketio.workspace = true

[dev-dependencies]
smcp-server-core.workspace = true
smcp-server-hyper.workspace = true
tokio = { workspace = true }
# #219：真设施「自动重连后回房」测试的 capture server —— 裸 socketioxide + hyper + TCP proxy，用
# **可控的房间裁决语义**在真实 Socket.IO 栈与真实 TCP 中断下驱动自动重连、回房重放与退避重试。
# capture-server harness for the real-facility office-rejoin tests.
socketioxide.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower.workspace = true
http-body-util.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
